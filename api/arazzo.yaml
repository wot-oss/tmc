arazzo: 1.0.0
info:
  title: Thing Model Catalog - Author Attachments Workflow
  summary: Test workflows for managing author attachments
  version: 1.0.0
  description: |
    Test workflow for managing author attachments in the Thing Model Catalog.
    This workflow tests the complete lifecycle of attachments: 
    initial empty state, upload, verification, deletion, and final empty state.

sourceDescriptions:
  - name: tmc
    url: http://localhost:8080
    type: openapi

workflows:
  - workflowId: authorAttachmentsLifecycle
    summary: Complete author attachments lifecycle test
    description: |
      Tests the full lifecycle of author attachments:
      1. Verify no attachments exist initially
      2. Upload an attachment
      3. Verify the attachment appears in the list
      4. Delete the attachment
      5. Verify the attachment list is empty again

    inputs:
      type: object
      properties:
        authorName:
          type: string
          default: test
        repoName:
          type: string
          default: test
        attachmentFileName:
          type: string
          default: test.txt
    
    steps:
      - stepId: verifyInitialEmptyState
        operationId: listAuthorsAttachments
        description: Verify that no attachments exist initially for the author
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          debugStatusCode: $statusCode
          entireResponse: $response.body#

      - stepId: uploadAttachment
        operationId: putAuthorAttachmentByName
        description: Upload a new attachment to the author
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: attachmentFileName
            in: path
            value: $inputs.attachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
        requestBody:
          contentType: text/plain
          payload: This is a test attachment content for the author.
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          debugStatusCode: $statusCode
      - stepId: verifyAttachmentExists
        operationId: listAuthorsAttachments
        description: Verify that the uploaded attachment now appears in the list
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: deleteAttachment
        operationId: deleteAuthorAttachmentByName
        description: Delete the uploaded attachment
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: attachmentFileName
            in: path
            value: $inputs.attachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          debugStatusCode: $statusCode
      - stepId: verifyFinalEmptyState
        operationId: listAuthorsAttachments
        description: Verify that the attachments list is empty after deletion
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

    outputs:
      step1_initial_list_status: $steps.verifyInitialEmptyState.outputs.debugStatusCode
      step1_initial_list_headers: $steps.verifyInitialEmptyState.outputs.debugResponseHeaders
      step1_initial_list_body: $steps.verifyInitialEmptyState.outputs.entireResponse
      step2_upload_status: $steps.uploadAttachment.outputs.debugStatusCode
      step2_upload_headers: $steps.uploadAttachment.outputs.debugResponseHeaders
      step3_post_upload_list_status: $steps.verifyAttachmentExists.outputs.debugStatusCode
      step3_post_upload_list_headers: $steps.verifyAttachmentExists.outputs.debugResponseHeaders
      step3_post_upload_list_body: $steps.verifyAttachmentExists.outputs.debugResponseBody
      step4_delete_status: $steps.deleteAttachment.outputs.debugStatusCode
      step4_delete_headers: $steps.deleteAttachment.outputs.debugResponseHeaders
      step5_final_list_status: $steps.verifyFinalEmptyState.outputs.debugStatusCode
      step5_final_list_headers: $steps.verifyFinalEmptyState.outputs.debugResponseHeaders
      step5_final_list_body: $steps.verifyFinalEmptyState.outputs.debugResponseBody

  - workflowId: authorAttachmentsErrorHandling
    summary: Test error scenarios for author attachments
    description: |
      Tests various error conditions:
      1. Attempting to delete non-existent attachment
      2. Attempting to get attachments for non-existent author
    
    inputs:
      type: object
      properties:
        repoName:
          type: string
          default: test
    
    steps:
      - stepId: deleteNonExistentAttachment
        operationId: deleteAuthorAttachmentByName
        description: Attempt to delete an attachment that doesn't exist
        parameters:
          - name: authorName
            in: path
            value: test
          - name: attachmentFileName
            in: path
            value: nonexistent.txt
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 404

      - stepId: getNonExistentAuthorAttachments
        operationId: listAuthorsAttachments
        description: Attempt to get attachments for a non-existent author
        parameters:
          - name: authorName
            in: path
            value: nonexistentauthor
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: addTMAndAttachmentsLifecycle
    summary: Add TM, add attachments on all scopes, verify and clean up
    description: |
      Add TM (attachments) lifecycle:
      1. Find repo
      2. Add TM
      3. Verify TM can be fetched
      4. Add attachments for tmname, tmid, author, manufacturer
      5. List attachments to verify
      6. Delete attachments and TM
      7. List again to verify

    inputs:
      type: object
      properties:
        repoName:
          type: string
          default: small
        authorName:
          type: string
          default: mycompany
        manufacturerName:
          type: string
          default: bartech
        mpnName:
          type: string
          default: bazlamp
        tmName:
          type: string
          default: mycompany/bartech/bazlamp
        fetchName:
          type: string
          default: mycompany/bartech/bazlamp
        tmNameAttachmentFileName:
          type: string
          default: tmname-test.txt
        tmIDAttachmentFileName:
          type: string
          default: tmid-test.txt
        authorAttachmentFileName:
          type: string
          default: author-test.txt
        manufacturerAttachmentFileName:
          type: string
          default: manufacturer-test.txt

    steps:
      - stepId: findRepo
        description: findRepo
        operationId: getRepos
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $statusCode
          body: $response.body#
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: addTM
        description: addTM
        operationId: importThingModel
        parameters:
          - name: repo
            in: query
            value: $inputs.repoName
          - name: force
            in: query
            value: true
        requestBody:
          contentType: application/json
          payload:
            '@context':
              - https://www.w3.org/2022/wot/td/v1.1
              - schema:
                  https://schema.org/
            '@type': tm:ThingModel
            title: BazLamp Smart
            description: Arazzo generated TM used for lifecycle tests
            schema:author:
              schema:name: $inputs.authorName
            schema:manufacturer:
              schema:name: $inputs.manufacturerName
            schema:mpn: $inputs.mpnName
            version:
              model: v0.0.1
            properties:
              status:
                type: string
                readOnly: true
            actions:
              toggle:
                description: Turn the lamp on or off
        successCriteria:
          - condition: $statusCode == 201 || $statusCode == 409
        outputs:
          status: $statusCode
          body: $response.body#
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: locateLatestTM
        description: locateLatestTM
        operationId: getInventoryByFetchName
        parameters:
          - name: fetchName
            in: path
            value: $inputs.fetchName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $statusCode
          tmID: $response.body#/data/tmID
          body: $response.body#
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: getTMToVerify
        description: getTMToVerify
        operationId: getThingModelById
        parameters:
          - name: tmID
            in: path
            value: $steps.locateLatestTM.outputs.tmID
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $statusCode
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: addTMNameAttachment
        description: addTMNameAttachment
        operationId: putTMNameAttachment
        parameters:
          - name: tmName
            in: path
            value: $inputs.tmName
          - name: attachmentFileName
            in: path
            value: $inputs.tmNameAttachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
          - name: force
            in: query
            value: true
        requestBody:
          contentType: text/plain
          payload: attachment created through tmName endpoint
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          status: $statusCode
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: addTMIDAttachment
        description: addTMIDAttachment
        operationId: putTMIDAttachment
        parameters:
          - name: tmID
            in: path
            value: $steps.locateLatestTM.outputs.tmID
          - name: attachmentFileName
            in: path
            value: $inputs.tmIDAttachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
          - name: force
            in: query
            value: true
        requestBody:
          contentType: text/plain
          payload: attachment created through tmID endpoint
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          status: $statusCode
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: addAuthorAttachment
        description: addAuthorAttachment
        operationId: putAuthorAttachmentByName
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: attachmentFileName
            in: path
            value: $inputs.authorAttachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
          - name: force
            in: query
            value: true
        requestBody:
          contentType: text/plain
          payload: attachment created through author endpoint
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          status: $statusCode
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: addManufacturerAttachment
        description: addManufacturerAttachment
        operationId: putManufacturerAttachmentByName
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: manufacturerName
            in: path
            value: $inputs.manufacturerName
          - name: attachmentFileName
            in: path
            value: $inputs.manufacturerAttachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
          - name: force
            in: query
            value: true
        requestBody:
          contentType: text/plain
          payload: attachment created through manufacturer endpoint
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          status: $statusCode
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: listTMNameAttachments
        description: listTMNameAttachments
        operationId: listTMNameAttachmentsByName
        parameters:
          - name: tmName
            in: path
            value: $inputs.tmName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $statusCode
          body: $response.body#
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: listTMIDAttachments
        description: listTMIDAttachments
        operationId: listThingModelAttachmentsById
        parameters:
          - name: tmID
            in: path
            value: $steps.locateLatestTM.outputs.tmID
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $statusCode
          body: $response.body#
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: listAuthorAttachments
        description: listAuthorAttachments
        operationId: listAuthorsAttachments
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $statusCode
          body: $response.body#
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: listManufacturerAttachments
        description: listManufacturerAttachments
        operationId: listManufacturersAttachments
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: manufacturerName
            in: path
            value: $inputs.manufacturerName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $statusCode
          body: $response.body#
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: deleteTMNameAttachment
        description: deleteTMNameAttachment
        operationId: deleteTMNameAttachment
        parameters:
          - name: tmName
            in: path
            value: $inputs.tmName
          - name: attachmentFileName
            in: path
            value: $inputs.tmNameAttachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: deleteTMIDAttachment
        description: deleteTMIDAttachment
        operationId: deleteThingModelAttachmentByName
        parameters:
          - name: tmID
            in: path
            value: $steps.locateLatestTM.outputs.tmID
          - name: attachmentFileName
            in: path
            value: $inputs.tmIDAttachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: deleteAuthorAttachment
        description: deleteAuthorAttachment
        operationId: deleteAuthorAttachmentByName
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: attachmentFileName
            in: path
            value: $inputs.authorAttachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: deleteManufacturerAttachment
        description: deleteManufacturerAttachment
        operationId: deleteManufacturerAttachmentByName
        parameters:
          - name: authorName
            in: path
            value: $inputs.authorName
          - name: manufacturerName
            in: path
            value: $inputs.manufacturerName
          - name: attachmentFileName
            in: path
            value: $inputs.manufacturerAttachmentFileName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: deleteTM
        description: deleteTM
        operationId: deleteThingModelById
        parameters:
          - name: tmID
            in: path
            value: $steps.locateLatestTM.outputs.tmID
          - name: repo
            in: query
            value: $inputs.repoName
          - name: force
            in: query
            value: "true"
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: verifyTMNameAttachmentsAfterDelete
        description: verifyTMNameAttachmentsAfterDelete
        operationId: listTMNameAttachmentsByName
        parameters:
          - name: tmName
            in: path
            value: $inputs.tmName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 200 || $statusCode == 404
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

      - stepId: verifyTMDeleted
        description: verifyTMDeleted
        operationId: getInventoryByFetchName
        parameters:
          - name: fetchName
            in: path
            value: $inputs.fetchName
          - name: repo
            in: query
            value: $inputs.repoName
        successCriteria:
          - condition: $statusCode == 404 || $statusCode == 200
        outputs:
          debugStatusCode: $statusCode
          debugResponseBody: $response.body#

    outputs:
      step1_find_repo_status: $steps.findRepo.outputs.debugStatusCode
      step1_find_repo_body: $steps.findRepo.outputs.debugResponseBody
      step2_add_tm_status: $steps.addTM.outputs.debugStatusCode
      step2_add_tm_body: $steps.addTM.outputs.debugResponseBody
      step3_1_locate_latest_tm_status: $steps.locateLatestTM.outputs.debugStatusCode
      step3_1_locate_latest_tm_body: $steps.locateLatestTM.outputs.debugResponseBody
      step3_2_get_tm_to_verify_status: $steps.getTMToVerify.outputs.debugStatusCode
      step3_2_get_tm_to_verify_body: $steps.getTMToVerify.outputs.debugResponseBody
      step4_1_add_tmname_attachment_status: $steps.addTMNameAttachment.outputs.debugStatusCode
      step4_2_add_tmid_attachment_status: $steps.addTMIDAttachment.outputs.debugStatusCode
      step4_3_add_author_attachment_status: $steps.addAuthorAttachment.outputs.debugStatusCode
      step4_4_add_manufacturer_attachment_status: $steps.addManufacturerAttachment.outputs.debugStatusCode
      step5_1_list_tmname_attachments_status: $steps.listTMNameAttachments.outputs.debugStatusCode
      step5_1_list_tmname_attachments_body: $steps.listTMNameAttachments.outputs.debugResponseBody
      step5_2_list_tmid_attachments_status: $steps.listTMIDAttachments.outputs.debugStatusCode
      step5_2_list_tmid_attachments_body: $steps.listTMIDAttachments.outputs.debugResponseBody
      step5_3_list_author_attachments_status: $steps.listAuthorAttachments.outputs.debugStatusCode
      step5_3_list_author_attachments_body: $steps.listAuthorAttachments.outputs.debugResponseBody
      step5_4_list_manufacturer_attachments_status: $steps.listManufacturerAttachments.outputs.debugStatusCode
      step5_4_list_manufacturer_attachments_body: $steps.listManufacturerAttachments.outputs.debugResponseBody
      step6_1_delete_tmname_attachment_status: $steps.deleteTMNameAttachment.outputs.debugStatusCode
      step6_2_delete_tmid_attachment_status: $steps.deleteTMIDAttachment.outputs.debugStatusCode
      step6_3_delete_author_attachment_status: $steps.deleteAuthorAttachment.outputs.debugStatusCode
      step6_4_delete_manufacturer_attachment_status: $steps.deleteManufacturerAttachment.outputs.debugStatusCode
      step6_5_delete_tm_status: $steps.deleteTM.outputs.debugStatusCode
      step7_1_verify_tmname_attachments_after_delete_status: $steps.verifyTMNameAttachmentsAfterDelete.outputs.debugStatusCode
      step7_1_verify_tmname_attachments_after_delete_body: $steps.verifyTMNameAttachmentsAfterDelete.outputs.debugResponseBody
      step7_2_verify_tm_deleted_status: $steps.verifyTMDeleted.outputs.debugStatusCode
      step7_2_verify_tm_deleted_body: $steps.verifyTMDeleted.outputs.debugResponseBody
      # repo_lookup: $steps.findRepo.outputs.body
      # located_tm_id: $steps.locateLatestTM.outputs.tmID
      # list_tmname_attachments: $steps.listTMNameAttachments.outputs.body
      # list_tmid_attachments: $steps.listTMIDAttachments.outputs.body
      # list_author_attachments: $steps.listAuthorAttachments.outputs.body
      # list_manufacturer_attachments: $steps.listManufacturerAttachments.outputs.body

  - workflowId: adminHealthcheckWorkflow
    summary: Inspect all health endpoints
    description: Calls all health check endpoints and verifies healthy status.

    steps:
      - stepId: healthOverall
        description: healthOverall
        operationId: getHealth
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          status: $statusCode

      - stepId: healthLive
        description: healthLive
        operationId: getHealthLive
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          status: $statusCode

      - stepId: healthReady
        description: healthReady
        operationId: getHealthReady
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          status: $statusCode

      - stepId: healthStartup
        description: healthStartup
        operationId: getHealthStartup
        successCriteria:
          - condition: $statusCode == 204
        outputs:
          status: $statusCode

    outputs:
      step1_overall_status: $steps.healthOverall.outputs.status
      step2_live_status: $steps.healthLive.outputs.status
      step3_ready_status: $steps.healthReady.outputs.status
      step4_startup_status: $steps.healthStartup.outputs.status
